# Android App Bundle (.aab) üretimi.
#
# NEDEN CI'DA: Play Store'a yüklenecek dosyayı üretmek için Android SDK
# ve JDK gerekiyor. GitHub'ın ubuntu runner'larında ikisi de KURULU
# geliyor — yani kendi makinene Android Studio kurmadan da imzalı bir
# paket alabilirsin. Android Studio'yu yine kurabilirsin (emülatörde
# denemek için iyi), ama yayın dosyası için şart değil.
#
# Bu iş ELLE tetikleniyor (workflow_dispatch): her push'ta paket
# üretmek gereksiz. Sürüm kodu ise her üretimde kendiliğinden bir
# artar (aşağıdaki "Sürüm kodu" adımı). Repoya yazılmaz; main'e
# push iOS derlemesini de ateşlerdi.
#
# ── ÖNCE YAPILACAKLAR (bir kez) ────────────────────────────────────
#
# 1) İmza anahtarını üret — KENDİ MAKİNENDE, sunucuda değil:
#
#      Windows : .\scripts\imza-uret.ps1
#      mac/Linux: bash scripts/imza-uret.sh
#
#    ANAHTARI KAYBETME. Kaybedersen uygulamayı bir daha
#    güncelleyemezsin — Google yeni anahtarla yüklemeyi kabul etmiyor.
#
# 2) Anahtarı base64'e çevir (dosya doğrudan secret olamıyor):
#
#      base64 -w0 sultanlar.jks > sultanlar.b64      # Linux
#      base64 -i sultanlar.jks | tr -d '\n'          # macOS
#
# 3) GitHub → Settings → Secrets and variables → Actions:
#
#    Secrets (gizli):
#      KEYSTORE_BASE64     → 2. adımdaki uzun metin
#      KEYSTORE_PASSWORD   → anahtar deposu parolası
#      KEY_ALIAS           → sultanlar
#      KEY_PASSWORD        → anahtar parolası
#
#    PAROLADA TERS BÖLÜ (\) OLMASIN: bu adım parolaları Java
#    `Properties` biçiminde yazıyor ve orada `\` kaçış karakteri —
#    sessizce yutuluyor, sonuç anlaşılmaz bir "yanlış parola" hatası.
#
#    Variables (gizli değil):
#      VITE_RELE_URL            → wss://rele.retrovoleybol.online
#      VITE_ADMOB_APP_ID        → AdMob uygulama kimliği (ca-app-pub-…~…)
#      VITE_ADMOB_REWARDED_ID   → ödüllü birim (ca-app-pub-…/…)
#      ADMOB_APP_ID             → aynı uygulama kimliği (AndroidManifest)
#
#    AdMob yoksa Google TEST kimlikleri gömülür — para getirmez.
#    Play'e para kazandıran paket için üçünü de Variables'a yaz.
#
#    Röle adresi neden secret DEĞİL: zaten istemci paketinin içinde,
#    yani herkes görebiliyor. Secret'a koymak gizlilik değil, yanlış
#    bir güven duygusu verirdi.
#
#    NEDEN KENDİ ALAN ADI: adres .aab'nin İÇİNE gömülüyor. Eskiden
#    kullanılan `rele-178-104-2-249.sslip.io` IP'yi adın içinde
#    taşıyordu — sunucu taşınsa mağazadaki uygulamanın çevrimiçi modu
#    ölürdü. `npm run paket` artık IP'ye bağlı adresi reddediyor.
#
# ── KULLANIM ───────────────────────────────────────────────────────
#
#   GitHub → Actions → "android aab" → Run workflow
#
# Her çalıştırma Play sürüm kodunu bir artırır. 110 da kullanıldı;
# sıradaki paket 111, sonrakiler 112, 113…
# Koşumun özetinde kod yazılır; indirilen paketin adı da onu taşır.
# Bittiğinde Artifacts bölümünden .aab indirilir ve Play Console'a yüklenir.

name: android aab

on:
  workflow_dispatch:
    inputs:
      imzala:
        description: 'İmzalı paket üret (anahtar secret olarak tanımlıysa)'
        type: boolean
        default: true
  #
  # BU TETİK İŞ YAPMAZ — yalnızca GitHub'ın bu dosyayı TANIMASI için.
  #
  # Sorun şuydu: yalnız `workflow_dispatch` taşıyan bir iş, Actions
  # listesinde hiç görünmedi. Dosya iki dalda da duruyordu, YAML
  # kusursuzdu, ama GitHub API'si dosya adıyla sorulduğunda 404
  # döndürüyordu — yani iş hiç kaydedilmemişti ve "Run workflow"
  # düğmesi de doğal olarak yoktu. Dosyaya dokunmak da yeniden
  # adlandırmak da işe yaramadı.
  #
  # GitHub bir işi, ona KOŞUM ürettiğinde de kaydediyor. Bu tetik tam
  # olarak bunun için var: yalnızca bu dosya değiştiğinde ateşleniyor
  # ve aşağıdaki `if` sayesinde iş ATLANIYOR. Yani koşum oluşuyor
  # (kayıt için yeter), dakika harcanmıyor, imzasız paket üretilmiyor.
  push:
    paths:
      - '.github/workflows/android-aab.yml'

# En az yetki: kodu okur, kendi geçmiş koşularını sayar. Yazmaz.
permissions:
  contents: read
  actions: read

# İki üretim aynı anda aynı sürüm kodunu hesaplamasın. İkincisi
# birincisi bitene kadar bekler; bekleyen fazlası iptal edilir.
concurrency:
  group: android-aab
  cancel-in-progress: false

jobs:
  aab:
    # Gerçek iş YALNIZCA elle tetiklenince koşuyor. Yukarıdaki push
    # tetiği kayıt içindi; onun ürettiği koşumda bu iş atlanıyor.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      # AGP 8.2 JDK 17+ istiyor. Runner'da birkaç sürüm var; hangisinin
      # kullanılacağını açıkça söylemek, varsayılan değişince yapının
      # sessizce bozulmasını engelliyor.
      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      # `npm run paket` kendi ön denetimini koşturuyor: röle adresi
      # eksik, yerel ya da şifresizse burada durur ve sebebini söyler.
      # Bu denetim olmadan paket sessizce çevrimiçi modsuz çıkardı.
      - name: Web yapısı + Capacitor eşitleme
        env:
          VITE_RELE_URL: ${{ vars.VITE_RELE_URL }}
          VITE_ADMOB_APP_ID: ${{ vars.VITE_ADMOB_APP_ID }}
          VITE_ADMOB_REWARDED_ID: ${{ vars.VITE_ADMOB_REWARDED_ID }}
        run: npm run paket

      # Anahtar secret'lardan geliyor ve DİSKE yalnız bu adımda
      # yazılıyor. `keystore.properties` .gitignore'da; runner da her
      # koşumda sıfırdan kurulduğu için iz kalmıyor.
      - name: İmza anahtarını hazırla
        if: ${{ inputs.imzala }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret'ı tanımlı değil."
            echo "İmzasız paket istiyorsan 'imzala' seçeneğini kapat."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/imza.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/imza.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      # Play aynı versionCode'u ikinci kez kabul etmez.
      # 109 ve 110 kullanıldı. main hâlâ package.json'dan 110 basıyordu;
      # bu adım yokken iki üretim de 110 oldu.
      # iOS ipa'daki CFBundleVersion ile aynı fikir: her yeni koşu ve
      # aynı koşunun yeniden denemesi daha büyük bir tam sayı üretir.
      # Repoya yazılmaz.
      #
      # ESKI: bu satır yazılırken tamamlanmış workflow_dispatch sayısı.
      # SON: Play'in kabul ettiği son kod. İlk yeni üretim SON+1.
      # API eksik dönerse dur; 110'u bir daha basma.
      - name: Sürüm kodu
        id: surum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ESKI=16
          SON=110
          ONCEKI=$(gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-aab.yml/runs?event=workflow_dispatch&status=completed&per_page=100" \
            --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | .run_attempt" \
            | awk '{s+=$1} END {print s+0}')
          if [ "$ONCEKI" -lt "$ESKI" ]; then
            echo "::error::Önceki üretimler sayılamadı ($ONCEKI < $ESKI). Sürüm kodu tahmin edilmedi."
            exit 1
          fi
          KOD=$(( SON + (ONCEKI - ESKI) + GITHUB_RUN_ATTEMPT ))
          if [ "$KOD" -le "$SON" ]; then
            echo "::error::Sürüm kodu $SON'dan büyük olmalı: $KOD"
            exit 1
          fi
          echo "Play sürüm kodu: $KOD (versionName package.json'da kalır)"
          echo "ANDROID_VERSION_CODE=$KOD" >> "$GITHUB_ENV"
          echo "code=$KOD" >> "$GITHUB_OUTPUT"
          echo "### Play sürüm kodu: \`$KOD\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Bundle üret
        working-directory: android
        env:
          ADMOB_APP_ID: ${{ vars.ADMOB_APP_ID }}
          ANDROID_VERSION_CODE: ${{ steps.surum.outputs.code }}
        run: ./gradlew --no-daemon bundleRelease

      # İmzalı mı gerçekten? Gradle imzasız bir paketi de sessizce
      # üretiyor ve Play Console reddi ancak yükleme anında görülüyor.
      # Burada bakmak, o turu baştan kurtarıyor.
      - name: İmzayı doğrula
        if: ${{ inputs.imzala }}
        run: |
          # Çıktı klasörü: AGP ara dosyayı da .aab diye yazıyor
          # (`intermediates/.../intermediary-bundle.aab`) ve o İMZASIZ.
          # `find android` onu önce bulunca Play'e gidecek paket imzalı
          # olsa bile koşum "imzasız" deyip duruyordu.
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          echo "paket: $AAB"
          if [ -z "$AAB" ] || [ ! -f "$AAB" ]; then
            echo "::error::Yayın .aab bulunamadı (outputs/bundle/release)."
            find android -name '*.aab' -print || true
            exit 1
          fi
          if unzip -l "$AAB" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC"; then
            echo "✓ imzalı"
          else
            echo "::error::Paket İMZASIZ — Play Store kabul etmez."
            unzip -l "$AAB" | grep META-INF || true
            exit 1
          fi

      # mapping.txt: R8 açıkken Play kilitlenme izlerini çözmek için.
      # AAB ile birlikte artifact'ta durur; Console → Uygulama bütünlüğü
      # → yükleme (deobfuscation file) alanına bu dosya gider.
      - name: Haritayı doğrula
        run: |
          MAP=android/app/build/outputs/mapping/release/mapping.txt
          if [ ! -f "$MAP" ]; then
            echo "::error::mapping.txt yok — minify kapalı kalmış olabilir."
            exit 1
          fi
          echo "mapping: $(wc -l < "$MAP") satır"

      - name: Paketi yükle
        uses: actions/upload-artifact@v5
        with:
          name: retro-voleybol-aab-${{ steps.surum.outputs.code }}
          path: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          # 90 gün Play Console'a yüklemek için fazlasıyla yeterli;
          # dosya zaten yeniden üretilebilir.
          retention-days: 90
