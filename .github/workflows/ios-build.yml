# iOS .ipa — Mac olmadan, GitHub'ın macOS koşucusunda.
#
# Her `main` push'unda ve elle tetiklenince: web yapısını alır, Capacitor
# iOS projesine kopyalar, imzalar, .ipa üretir ve App Store Connect'e
# (TestFlight) yükler.
#
# macOS dakikası ücretlidir. Secret'lar tanımlı değilken bu iş başarısız
# olur; ilk yüklemeden önce aşağıdaki secret'ları gir.
#
# ── BİR KEZ YAPILACAKLAR ───────────────────────────────────────────
#
# 1) App Store Connect → Users and Access → Integrations → App Store
#    Connect API → Team Keys. Anahtar rolü Admin ya da App Manager
#    olmalı; yoksa otomatik imza profili oluşturamaz.
#
# 2) İndirilen `AuthKey_XXXXXXXX.p8` dosyasını GitHub secret'ına koy.
#    Dosyanın kendisi ya da base64'ü kabul edilir.
#
# 3) GitHub → Settings → Secrets and variables → Actions:
#
#    Secrets:
#      APP_STORE_CONNECT_PRIVATE_KEY   → .p8 içeriği (veya base64)
#      APP_STORE_CONNECT_KEY_ID        → AuthKey_SONRASI, 10 karakter
#      APP_STORE_CONNECT_ISSUER_ID     → issuer UUID
#      APPLE_BUNDLE_ID                 → com.nodify.retrovoleybol
#      APPLE_TEAM_ID                   → developer.apple.com → Membership
#                                        10 karakterlik Team ID
#      BUILD_CERTIFICATE_BASE64       → Apple Distribution .p12, base64
#      P12_PASSWORD                    → .p12 dışa aktarma parolası
#      BUILD_PROVISION_PROFILE_BASE64 → App Store .mobileprovision, base64
#
#    İmza artık elle: koşucu her seferinde sıfırlandığı için Xcode'un
#    kendi development sertifikasını üretmesi işe yaramıyor. .p12 ve
#    profil bu adımda geçici bir keychain'e kuruluyor.
#
#    Variables (gizli değil, Android işiyle aynı):
#      VITE_RELE_URL → wss://rele.retrovoleybol.online
#
#    Röle adresi paketin İÇİNE gömülür. Boşsa `paket-onkontrol` durur:
#    mağazaya çevrimiçi menüsü olmayan bir sürüm gitmesin.
#
# 4) App Store Connect'te bu bundle id ile bir uygulama kaydı aç.
#    İlk yükleme, kayıt yoksa reddedilir. Otomatik imza, portalda
#    App ID yoksa ve anahtar yetkiliyse onu oluşturabilir; uygulama
#    kaydını oluşturamaz.
#
# Bundle id neden Android paketinden (`app.retrovoleybol.oyun`) farklı:
# Play'deki paket adı yayınlandıktan sonra değişmez. iOS kimliği
# `com.nodify.retrovoleybol` olarak Xcode projesinde durur; CI yine de
# `APPLE_BUNDLE_ID` secret'ını esas alır.

name: ios ipa

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APPLE_BUNDLE_ID: ${{ secrets.APPLE_BUNDLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
      P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
      BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
    steps:
      - name: Select Xcode Version
        run: |
          # App Store, 28 Nisan 2026'dan beri iOS 26 SDK / Xcode 26 istiyor.
          # macos-15 varsayılanı Xcode 16.4 (iOS 18.5); bu da reddedilir.
          # Xcode_16.app yolu duruyor ama içinde iOS 18 SDK var.
          secilen=""
          for ad in Xcode_26.3 Xcode_26.2 Xcode_26.1.1 Xcode_26.1 Xcode_26.0.1 Xcode_26.0; do
            if [ -d "/Applications/${ad}.app/Contents/Developer" ]; then
              secilen="/Applications/${ad}.app/Contents/Developer"
              break
            fi
          done
          if [ -z "$secilen" ]; then
            echo "::error::iOS 26 SDK için Xcode 26 bulunamadı."
            ls -d /Applications/Xcode*.app || true
            exit 1
          fi
          sudo xcode-select -s "$secilen"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Secret'ları denetle
        run: |
          eksik=0
          for ad in APP_STORE_CONNECT_PRIVATE_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID APPLE_BUNDLE_ID APPLE_TEAM_ID BUILD_CERTIFICATE_BASE64 P12_PASSWORD BUILD_PROVISION_PROFILE_BASE64; do
            if [ -z "${!ad}" ]; then
              echo "::error::$ad secret'ı tanımlı değil."
              eksik=1
            fi
          done
          exit "$eksik"

      - name: Install
        run: npm ci

      - name: Web yapısı + iOS kopyası
        env:
          VITE_RELE_URL: ${{ vars.VITE_RELE_URL }}
        run: |
          node scripts/paket-onkontrol.mjs
          npm run build
          npx cap sync ios

      - name: API anahtarını yaz
        run: |
          umask 077
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          if printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            printf '%s\n' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$KEY_PATH"
          else
            printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" | tr -d '[:space:]' | base64 -d > "$KEY_PATH"
            printf '\n' >> "$KEY_PATH"
          fi
          test -s "$KEY_PATH"
          echo "Anahtar yazıldı (${APP_STORE_CONNECT_KEY_ID})."

      - name: Sertifika ve profili yükle
        run: |
          umask 077
          P12_PATH="$RUNNER_TEMP/distribution.p12"
          PROFILE="$RUNNER_TEMP/appstore.mobileprovision"
          DECODED="$RUNNER_TEMP/profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          # +, / ve = security'nin parola ayrıştırmasını bozmasın.
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          # Secret yapıştırılırken gelen satır sonu parolayı değiştirir;
          # "MAC verification failed" o zaman yanlış parola sanılır.
          P12_PASSWORD="${P12_PASSWORD//$'\r'/}"
          P12_PASSWORD="${P12_PASSWORD%$'\n'}"
          export P12_PASSWORD

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | tr -d '[:space:]' | base64 -d > "$P12_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | tr -d '[:space:]' | base64 -d > "$PROFILE"
          test -s "$P12_PATH"
          test -s "$PROFILE"

          # OpenSSL 3, PKCS#12'yi SHA-256 MAC ile yazar. macOS Security
          # framework bunu "MAC verification failed" diye reddeder; parola
          # doğru olsa bile. Aktarmadan önce legacy SHA-1 MAC'e çevir.
          OPENSSL_BIN="$(command -v openssl)"
          if [ -x /opt/homebrew/opt/openssl@3/bin/openssl ]; then
            OPENSSL_BIN=/opt/homebrew/opt/openssl@3/bin/openssl
          elif [ -x /usr/local/opt/openssl@3/bin/openssl ]; then
            OPENSSL_BIN=/usr/local/opt/openssl@3/bin/openssl
          fi
          PEM="$RUNNER_TEMP/cert.pem"
          LEGACY="$RUNNER_TEMP/distribution-legacy.p12"
          "$OPENSSL_BIN" pkcs12 -in "$P12_PATH" -passin env:P12_PASSWORD -nodes -out "$PEM"
          if "$OPENSSL_BIN" pkcs12 -help 2>&1 | grep -q -- '-legacy'; then
            "$OPENSSL_BIN" pkcs12 -export -legacy -in "$PEM" -passout env:P12_PASSWORD -out "$LEGACY"
          else
            "$OPENSSL_BIN" pkcs12 -export -in "$PEM" -passout env:P12_PASSWORD \
              -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg SHA1 -out "$LEGACY"
          fi
          rm -f "$PEM"
          P12_PATH="$LEGACY"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 3600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/productsign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security cms -D -i "$PROFILE" > "$DECODED"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$DECODED")
          NAME=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$DECODED")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE" "$HOME/Library/MobileDevice/Provisioning Profiles/${UUID}.mobileprovision"

          {
            echo "PROFILE_NAME<<EOF"
            echo "$NAME"
            echo "EOF"
          } >> "$GITHUB_ENV"
          echo "Profil kuruldu: $NAME ($UUID)"

      - name: Arşivle
        run: |
          # PROVISIONING_PROFILE_SPECIFIER ve PROVISIONING_PROFILE komut
          # satırında verilmez; Pod hedeflerine miras kalır.
          # PROVISIONING_PROFILE_SPECIFIER[target=App] de kullanılamaz:
          # Xcode bunu koşul sanıp profil adını "App]=…" diye arar.
          # Profil yalnızca App hedefindeki APP_PROVISIONING_PROFILE
          # genişlemesine yazılır. Pod'larda imza kapalıdır.
          python3 - "$APPLE_TEAM_ID" "$APPLE_BUNDLE_ID" "$PROFILE_NAME" << 'PY'
          import pathlib, sys
          team, bundle, profile = sys.argv[1:]

          def quoted(value):
              escaped = value.replace("\\", "\\\\").replace('"', '\\"')
              return f'"{escaped}"'

          app = pathlib.Path("ios/App/App.xcodeproj/project.pbxproj")
          text = app.read_text()
          text = text.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;")
          text = text.replace(
              'DEVELOPMENT_TEAM = "$(APPLE_TEAM_ID)";',
              f"DEVELOPMENT_TEAM = {quoted(team)};",
          )
          text = text.replace(
              'PROVISIONING_PROFILE_SPECIFIER = "$(APP_PROVISIONING_PROFILE)";',
              f"PROVISIONING_PROFILE_SPECIFIER = {quoted(profile)};",
          )
          text = text.replace(
              "PRODUCT_BUNDLE_IDENTIFIER = com.nodify.retrovoleybol;",
              f"PRODUCT_BUNDLE_IDENTIFIER = {quoted(bundle)};",
          )
          if "$(APP_PROVISIONING_PROFILE)" in text:
              raise SystemExit("App hedefine profil adı yazılamadı")
          app.write_text(text)

          pods = pathlib.Path("ios/App/Pods/Pods.xcodeproj/project.pbxproj")
          kept = []
          for line in pods.read_text().splitlines(keepends=True):
              stripped = line.lstrip()
              if stripped.startswith((
                  "CODE_SIGNING_ALLOWED =",
                  "CODE_SIGNING_REQUIRED =",
                  "PROVISIONING_PROFILE_SPECIFIER =",
                  "PROVISIONING_PROFILE =",
              )):
                  continue
              kept.append(line)
              if stripped.startswith("buildSettings = {"):
                  indent = line[: len(line) - len(stripped)] + "\t"
                  kept.append(f"{indent}CODE_SIGNING_ALLOWED = NO;\n")
                  kept.append(f"{indent}CODE_SIGNING_REQUIRED = NO;\n")
                  kept.append(f'{indent}PROVISIONING_PROFILE_SPECIFIER = "";\n')
                  kept.append(f'{indent}PROVISIONING_PROFILE = "";\n')
          pods.write_text("".join(kept))
          PY
          mkdir -p ios/App/build
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -archivePath ios/App/build/App.xcarchive archive \
            APP_PROVISIONING_PROFILE="$PROFILE_NAME"

      - name: IPA dışa aktar
        run: |
          PLIST="$RUNNER_TEMP/ExportOptions.plist"
          # provisioningProfiles yalnızca uygulama bundle id'sini içerir.
          # Capacitor.framework ve Cordova.framework bu sözlüğe girerse
          # exportArchive çıkış kodu 70 verir.
          python3 - "$PLIST" "$APPLE_BUNDLE_ID" "$APPLE_TEAM_ID" "$PROFILE_NAME" << 'PY'
          import plistlib, sys
          path, bundle, team, profile = sys.argv[1:]
          data = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": team,
              "provisioningProfiles": {bundle: profile},
              "signingCertificate": "Apple Distribution",
              "manageAppVersionAndBuildNumber": True,
          }
          with open(path, "wb") as f:
              plistlib.dump(data, f)
          PY
          xcodebuild -exportArchive \
            -archivePath ios/App/build/App.xcarchive \
            -exportPath "$RUNNER_TEMP/ipa" \
            -exportOptionsPlist "$PLIST"
          find "$RUNNER_TEMP/ipa" -name '*.ipa' -exec ls -lh {} \;

      - name: IPA'yı sakla
        uses: actions/upload-artifact@v5
        with:
          name: retro-voleybol-ipa
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30

      - name: App Store Connect'e yükle
        run: |
          IPA=$(find "$RUNNER_TEMP/ipa" -name '*.ipa' | head -1)
          if xcrun --find altool >/dev/null 2>&1; then
            xcrun altool --upload-app --type ios \
              --file "$IPA" \
              --apiKey "$APP_STORE_CONNECT_KEY_ID" \
              --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          else
            xcrun iTMSTransporter -m upload \
              -assetFile "$IPA" \
              -apiKey "$APP_STORE_CONNECT_KEY_ID" \
              -apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
          fi
