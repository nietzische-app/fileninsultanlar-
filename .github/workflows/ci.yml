name: ci

on:
  push:
    branches: [main, 'claude/**', 'cursor/**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Tarayıcı testleri ayrı iş: Chromium indirmesi gerektiriyor ve hızlı
  # geri bildirim için `check` işini bekletmemeli. Bu projede kırılan
  # şeylerin çoğu mantık değil yerleşim ve girdi olduğu için bunlar
  # birim testleri kadar önemli.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-ekran-goruntuleri
          path: tests/ciktilar/
          if-no-files-found: ignore
