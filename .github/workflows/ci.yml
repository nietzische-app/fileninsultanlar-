name: ci

# NE ZAMAN KOŞUYOR: yalnız `main` ve açık bir pull request'te.
#
# Önce çalışma dalları da (`claude/**`, `cursor/**`) buradaydı ve her
# değişiklik İKİ koşum üretiyordu: biri dala push'ta, biri `main`'e
# birleştirmede. Yani her düzeltme için iki bildirim maili — bir gecede
# üç commit atınca altı mail. Dal koşumu, hemen ardından gelen `main`
# koşumunun aynısını yapıyordu.
#
# NEYİ KAYBEDİYORUZ, açıkça: dala push edilen bir değişiklik artık
# `main`'e girmeden sınanmıyor. Bu, geliştirmenin dalda birikip toplu
# birleştiği bir akışta kötü bir takas olurdu; burada dal `main`'e
# dakikalar içinde giriyor ve testler zaten birleştirmeden önce yerelde
# koşuluyor. Bir dalı önce sınamak istersen pull request aç — o hâlâ
# tetikliyor.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # Tarayıcı testleri ayrı iş: Chromium indirmesi gerektiriyor ve hızlı
  # geri bildirim için `check` işini bekletmemeli. Bu projede kırılan
  # şeylerin çoğu mantık değil yerleşim ve girdi olduğu için bunlar
  # birim testleri kadar önemli.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run e2e

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: e2e-ekran-goruntuleri
          path: tests/ciktilar/
          if-no-files-found: ignore
