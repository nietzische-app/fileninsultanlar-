# Android App Bundle (.aab) üretimi.
#
# NEDEN CI'DA: Play Store'a yüklenecek dosyayı üretmek için Android SDK
# ve JDK gerekiyor. GitHub'ın ubuntu runner'larında ikisi de KURULU
# geliyor — yani kendi makinene Android Studio kurmadan da imzalı bir
# paket alabilirsin. Android Studio'yu yine kurabilirsin (emülatörde
# denemek için iyi), ama yayın dosyası için şart değil.
#
# Bu iş ELLE tetikleniyor (workflow_dispatch): her push'ta paket
# üretmek hem gereksiz hem de sürüm numarası aynı kaldığı için
# üst üste aynı dosyayı yığardı.
#
# ── ÖNCE YAPILACAKLAR (bir kez) ────────────────────────────────────
#
# 1) İmza anahtarını üret (kendi makinende, JDK ile gelen keytool):
#
#      keytool -genkey -v -keystore sultanlar.jks \
#        -keyalg RSA -keysize 2048 -validity 10000 -alias sultanlar
#
#    ANAHTARI KAYBETME. Kaybedersen uygulamayı bir daha
#    güncelleyemezsin — Google yeni anahtarla yüklemeyi kabul etmiyor.
#
# 2) Anahtarı base64'e çevir (dosya doğrudan secret olamıyor):
#
#      base64 -w0 sultanlar.jks > sultanlar.b64      # Linux
#      base64 -i sultanlar.jks | tr -d '\n'          # macOS
#
# 3) GitHub → Settings → Secrets and variables → Actions:
#
#    Secrets (gizli):
#      KEYSTORE_BASE64     → 2. adımdaki uzun metin
#      KEYSTORE_PASSWORD   → anahtar deposu parolası
#      KEY_ALIAS           → sultanlar
#      KEY_PASSWORD        → anahtar parolası
#
#    PAROLADA TERS BÖLÜ (\) OLMASIN: bu adım parolaları Java
#    `Properties` biçiminde yazıyor ve orada `\` kaçış karakteri —
#    sessizce yutuluyor, sonuç anlaşılmaz bir "yanlış parola" hatası.
#
#    Variables (gizli değil):
#      VITE_RELE_URL       → wss://rele-178-104-2-249.sslip.io
#
#    Röle adresi neden secret DEĞİL: zaten istemci paketinin içinde,
#    yani herkes görebiliyor. Secret'a koymak gizlilik değil, yanlış
#    bir güven duygusu verirdi.
#
# ── KULLANIM ───────────────────────────────────────────────────────
#
#   GitHub → Actions → "android aab" → Run workflow
#
# Bittiğinde koşumun altındaki Artifacts bölümünden .aab indirilir ve
# Play Console'a yüklenir.

name: android aab

on:
  workflow_dispatch:
    inputs:
      imzala:
        description: 'İmzalı paket üret (anahtar secret olarak tanımlıysa)'
        type: boolean
        default: true

jobs:
  aab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # AGP 8.2 JDK 17+ istiyor. Runner'da birkaç sürüm var; hangisinin
      # kullanılacağını açıkça söylemek, varsayılan değişince yapının
      # sessizce bozulmasını engelliyor.
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install
        run: npm ci

      # `npm run paket` kendi ön denetimini koşturuyor: röle adresi
      # eksik, yerel ya da şifresizse burada durur ve sebebini söyler.
      # Bu denetim olmadan paket sessizce çevrimiçi modsuz çıkardı.
      - name: Web yapısı + Capacitor eşitleme
        env:
          VITE_RELE_URL: ${{ vars.VITE_RELE_URL }}
        run: npm run paket

      # Anahtar secret'lardan geliyor ve DİSKE yalnız bu adımda
      # yazılıyor. `keystore.properties` .gitignore'da; runner da her
      # koşumda sıfırdan kurulduğu için iz kalmıyor.
      - name: İmza anahtarını hazırla
        if: ${{ inputs.imzala }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret'ı tanımlı değil."
            echo "İmzasız paket istiyorsan 'imzala' seçeneğini kapat."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/imza.jks"
          cat > android/keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/imza.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Bundle üret
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease

      # İmzalı mı gerçekten? Gradle imzasız bir paketi de sessizce
      # üretiyor ve Play Console reddi ancak yükleme anında görülüyor.
      # Burada bakmak, o turu baştan kurtarıyor.
      - name: İmzayı doğrula
        if: ${{ inputs.imzala }}
        run: |
          AAB=$(find android -name '*.aab' | head -1)
          echo "paket: $AAB"
          if unzip -l "$AAB" | grep -q "META-INF/.*\.RSA\|META-INF/.*\.EC"; then
            echo "✓ imzalı"
          else
            echo "::error::Paket İMZASIZ — Play Store kabul etmez."
            exit 1
          fi

      - name: Paketi yükle
        uses: actions/upload-artifact@v4
        with:
          name: filenin-sultanlari-aab
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          # 90 gün Play Console'a yüklemek için fazlasıyla yeterli;
          # dosya zaten yeniden üretilebilir.
          retention-days: 90
