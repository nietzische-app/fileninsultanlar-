<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta
      name="description"
      content="8 bit piksel voleybol oyunu. HTML5 Canvas ile geliştirildi; içinde tek bir görsel dosyası yok."
    />
    <meta name="theme-color" content="#0b0b12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Voleybol" />
    <link rel="manifest" href="manifest.webmanifest" />

    <title>Retro Voleybol</title>

    <!--
      Retro piksel font — kendi sunucumuzdan.

      Google Fonts'tan çekilirken oyunun tüm görünümü harici bir isteğe
      bağlıydı: portal CSP'si engellerse ya da ağ yoksa yazı tipi
      Times New Roman'a düşüp retro havayı tamamen bozuyordu. Dosya
      7 KB, gömmenin bedeli yok.
    -->
    <!--
      İlk boya CSS yüklenmeden önce de koyu olsun. Capacitor varsayılan
      splash'i beyazdı; çentikli/uzun telefonda kenar o beyazı gösteriyordu.
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
        min-height: 100dvh;
        background-color: #0b0b12;
      }
      @font-face {
        font-family: 'Press Start 2P';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('./fonts/press-start-2p.woff2') format('woff2');
      }
    </style>

    <!--
      Favicon çalışma anında canvas'tan üretilir (src/main.jsx).
      Projede hiçbir görsel dosyası tutulmuyor.
    -->
  </head>
  <body class="bg-[#0b0b12]">
    <!-- React uygulaması buraya mount olur -->
    <div id="root"></div>

    <!-- Canvas, React tarafından #game-container içine yerleştirilir (src/App.jsx) -->
    <noscript>
      Bu oyunu oynamak için JavaScript'i etkinleştirmeniz gerekiyor.
    </noscript>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
