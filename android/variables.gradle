ext {
    /*
     * minSdk 24 = Android 7.0. Capacitor şablonu 22 (5.1) ile gelir
     * ama Play'in otomatik koruması (App Bundle'a eklenen anti-tamper)
     * 24 altını reddediyor. 12 Ekim 2026'da 22 ile yüklenen paket
     * tam bu yüzden geri döndü.
     *
     * Kaybedilen cihazlar Android 5.1 ve 6.0 — 2026'da yok denecek
     * kadar az. Oyunun ihtiyacı WebView; 24'te o zaten var.
     */
    minSdkVersion = 24

    /*
     * targetSdk: Google Play'in DAYATTIĞI sayı, bizim tercihimiz değil.
     *
     * Capacitor şablonu 34 ile geliyordu ve Play Store 34 hedefleyen
     * yeni yüklemeleri REDDEDİYOR — kural her yıl bir seviye
     * yükseliyor ve şablon geride kalmış. Reddi ancak yükleme anında
     * görürdük.
     *
     * DİKKAT: bu sayı zamanla eskiyor. Yüklemeden önce Play Console'un
     * söylediği güncel asgariyi doğrula; reddedilirse tek yapılacak
     * şey bu satırı yükseltip yeniden derlemek.
     *
     * VE ÖYLE OLDU: 35 ile üretilen paket 11 Eylül 2026'da yüklenirken
     * "hedeflemesi gereken en düşük API düzeyi 36" hatasıyla reddedildi.
     * 36'ya çıkıldı.
     *
     * Kullandığımız Android Gradle eklentisi (8.2.1) resmen 34'e kadar
     * sınanmış; 35'te yalnız UYARI verip derledi ve 36'da da aynısını
     * yapıyor. Uyarı `gradle.properties` içinde susturuldu — eklentiyi
     * yükseltmek Capacitor şablonunun bütün araç zincirine dokunmak
     * demek ve buradaki kazanç yalnız bir uyarı satırı.
     *
     * DAVRANIŞ DEĞİŞİKLİĞİ YOK: 36'nın getirdiği başlıca şey kenardan
     * kenara (edge-to-edge) zorlaması, o da 35'ten beri zaten geçerli
     * ve uygulamada devre dışı bırakan bir bayrak hiç olmadı.
     */
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.8.0'
    androidxAppCompatVersion = '1.6.1'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.12.0'
    androidxFragmentVersion = '1.6.2'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.9.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.1.5'
    androidxEspressoCoreVersion = '3.5.1'
    cordovaAndroidVersion = '10.1.1'
    /*
     * AdMob eklentisi Kotlin. Sürüm yoksa eklenti 1.9.10'a düşer;
     * burada sabitlemek AGP 8.2 ile uyumu görünür kılar.
     */
    kotlin_version = '1.9.10'
}