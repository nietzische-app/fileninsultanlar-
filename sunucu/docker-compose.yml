# Röle sunucusu — Hetzner (kendi sunucu) dağıtımı.
#
# Bu, mevcut bir nginx'in ÖNÜNDE değil ARKASINDA çalışacağı için port
# 80/443'e hiç dokunmuyor. Röle yalnızca 127.0.0.1:8787'de dinliyor —
# dışarıdan doğrudan erişilemez, TLS'i (wss://) mevcut nginx karşılıyor
# ve isteği buraya yönlendiriyor. `sunucu/nginx-rele.conf.ornek` o
# yönlendirmenin şablonu.
#
# Sunucuda 8787 numaralı portun başka bir şey tarafından kullanılmadığını
# önceden kontrol et: `ss -ltnp | grep 8787` boş dönmeli.
#
# Kullanım (sunucu/ dizininden):
#   docker compose up -d --build      # başlat
#   docker compose logs -f            # günlükleri izle
#   docker compose down               # durdur
#   docker compose up -d --build      # güncelleme sonrası yeniden başlat

services:
  rele:
    build: .
    container_name: filenin-rele
    restart: unless-stopped
    environment:
      - PORT=8787
    ports:
      # Yalnızca localhost'a bağlı — "0.0.0.0:8787" YAZMA, o zaman
      # röle sunucunun herkese açık IP'sinden TLS'siz erişilebilir olur.
      - "127.0.0.1:8787:8787"
