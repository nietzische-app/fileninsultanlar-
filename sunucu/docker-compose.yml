# Röle sunucusu — Hetzner (kendi sunucu) dağıtımı.
#
# Bu sunucuda 80/443'ü nginx değil, kendi Caddy konteynerin (aegis_net
# ağındaki `aegis-caddy`) kullanıyor. Röle port açmıyor — Caddy'nin
# ulaşabilmesi için aynı Docker ağına (`aegis_net`) katılıyor ve orada
# konteyner adıyla (`filenin-rele:8787`) görünüyor. `127.0.0.1:8787`
# ayrıca host'ta da açık duruyor — sunucunun kendi üstünden hızlı
# `curl` ile sağlık kontrolü yapabilmek için, dışarıya değil.
#
# `aegis_net` bu dosyada OLUŞTURULMUYOR (external: true) — zaten var
# olan ağa katılıyoruz. Ağ yoksa (örn. Caddy henüz kurulmadıysa)
# `docker compose up` "network aegis_net declared as external, but
# could not be found" diye durur; o zaman önce Caddy'nin ayakta
# olduğundan emin ol.
#
# Kullanım (sunucu/ dizininden):
#   docker compose up -d --build      # başlat / ağ eklemesini uygula
#   docker compose logs -f            # günlükleri izle
#   docker compose down               # durdur
#   docker compose up -d --build      # güncelleme sonrası yeniden başlat

services:
  rele:
    build:
      # Bağlam depo KÖKÜ: sunucu maçı koşturuyor ve oyun motorunu
      # (src/game) içe aktarıyor. Yalnız sunucu/ olsaydı imaj eksik
      # kalır, konteyner "Cannot find module" ile açılmazdı.
      context: ..
      dockerfile: sunucu/Dockerfile
    container_name: filenin-rele
    restart: unless-stopped

    # --- Kaynak sınırları ---
    #
    # Bu makine YALNIZ oyunu koşturmuyor: aynı kutuda başka üretim
    # servisleri var. Sınırsız bir konteyner, rölede bir bellek
    # sızıntısı olduğunda ötekileri de götürürdü. Sınırlar tahmin
    # değil, ölçüm: `node --expose-gc tests/olcum/kapasite.mjs`
    #
    #   maç   CPU   RSS
    #     1    %2   56 MB
    #    64   %14   64 MB
    #   128   %14   72 MB
    #   256   %17   88 MB
    #
    # 256 eşzamanlı maç (512 oyuncu) tek çekirdeğin %17'si ve 88 MB.
    # 256 MB ~3 kat pay bırakıyor; 1.0 CPU ölçülenin beş katı.
    # Darboğaz zaten işlemci değil, bant genişliği (maç başına
    # ~11.6 KB/sn) — bu sınırlar oyunu kısıtlamak için değil, ARIZA
    # ANINDA komşu servisleri korumak için.
    mem_limit: 256m
    cpus: 1.0

    # --- Günlük dönüşümü ---
    #
    # Docker'ın varsayılan json-file sürücüsü SINIRSIZ büyüyor. Uzun
    # koşan bir serviste bu, diski dolduran ve makinedeki HER ŞEYİ
    # durduran sessiz bir arıza. 3 × 10 MB fazlasıyla yeter: teşhis
    # için son birkaç saatin günlüğü zaten elimizde olur.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8787
      - VERI_DIZINI=/veri
    ports:
      # Yalnızca localhost'a bağlı — "0.0.0.0:8787" YAZMA, o zaman
      # röle sunucunun herkese açık IP'sinden TLS'siz erişilebilir olur.
      - "127.0.0.1:8787:8787"
    networks:
      - aegis_net
    volumes:
      # Oyuncu kayıtları KONTEYNERİN DIŞINDA durmalı: konteyner her
      # `docker compose up --build` ile yeniden kuruluyor ve içindeki
      # dosya sistemi gidiyor. Bu satır olmadan skor tablosu her
      # dağıtımda sıfırlanırdı — belirtisi de sinsi olurdu, çünkü
      # dağıtımdan hemen sonra bakan kimse fark etmez.
      #
      # Adlandırılmış birim (bind mount değil). Docker birimin adına
      # proje adını ekliyor, yani gerçek ad `sunucu_filenin-veri`
      # oluyor — `docker volume ls` ile doğrula, tahmin etme.
      # Yedek almak için en kolayı konteynerin içinden kopyalamak:
      #   docker compose cp rele:/veri/oyuncular.jsonl ./yedek.jsonl
      - filenin-veri:/veri

volumes:
  filenin-veri:

networks:
  aegis_net:
    external: true
